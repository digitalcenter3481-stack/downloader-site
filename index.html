<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DownAll - تحميل الفيديوهات والصور</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f8fa;
            color: #172033;
        }

        header {
            height: 70px;
            background: white;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        main {
            max-width: 900px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .description {
            color: #666;
            margin-bottom: 35px;
        }

        .download-box {
            display: flex;
            gap: 10px;
            background: white;
            padding: 10px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        input {
            flex: 1;
            border: 0;
            outline: none;
            padding: 18px;
            font-size: 16px;
            direction: ltr;
        }

        button {
            border: 0;
            background: #172b4d;
            color: white;
            padding: 0 30px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #status {
            margin-top: 25px;
            min-height: 30px;
        }

        .platforms {
            margin-top: 35px;
            color: #777;
        }

        @media(max-width:600px) {

            h1 {
                font-size: 30px;
            }

            .download-box {
                flex-direction: column;
            }

            button {
                height: 55px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">DownAll</div>
</header>

<main>

    <h1>حمّل الفيديوهات والصور بسهولة</h1>

    <p class="description">
        الصق رابط الفيديو أو الصورة للبدء
    </p>

    <div class="download-box">

        <input
            id="url"
            type="url"
            placeholder="الصق الرابط هنا..."
            autocomplete="off"
        >

        <button id="downloadBtn">
            تنزيل
        </button>

    </div>

    <div id="status"></div>

    <div class="platforms">
        يدعم حاليًا:
        YouTube · TikTok · Instagram · Facebook · X · Reddit · Pinterest
    </div>

</main>

<script>

const button = document.getElementById("downloadBtn");
const input = document.getElementById("url");
const status = document.getElementById("status");


button.addEventListener("click", async () => {

    const url = input.value.trim();

    if (!url) {
        status.textContent = "ضع الرابط أولاً.";
        return;
    }

    button.disabled = true;
    button.textContent = "جاري التحميل...";
    status.textContent = "جاري معالجة الرابط...";

    try {

        const response = await fetch("/api/download", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                url: url
            })

        });


        if (!response.ok) {

            let error = "فشل التحميل.";

            try {
                const data = await response.json();

                if (data.error) {
                    error = data.error;
                }

            } catch (_) {}

            throw new Error(error);
        }


        const blob = await response.blob();

        const downloadUrl = window.URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = downloadUrl;

        a.download = "download.mp4";

        document.body.appendChild(a);

        a.click();

        a.remove();

        window.URL.revokeObjectURL(downloadUrl);

        status.textContent = "تم التحميل بنجاح.";

    } catch (error) {

        status.textContent = error.message;

    } finally {

        button.disabled = false;

        button.textContent = "تنزيل";
    }

});

</script>

</body>
</html>

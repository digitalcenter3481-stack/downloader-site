<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المركز الرقمي | تحميل الفيديوهات والصور</title>

    <meta name="description"
          content="المركز الرقمي لتحميل الفيديوهات والصور بسهولة من الإنترنت">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Tahoma, sans-serif;
            background: #f5f7fa;
            color: #17233c;
        }

        header {
            height: 80px;
            background: white;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .hero {
            max-width: 950px;
            margin: auto;
            padding: 90px 20px 50px;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(35px, 6vw, 65px);
            margin: 0 0 20px;
        }

        .hero p {
            color: #707070;
            font-size: 20px;
            margin-bottom: 40px;
        }

        .download-box {
            background: white;
            max-width: 850px;
            margin: auto;
            padding: 15px;
            border-radius: 25px;
            box-shadow: 0 15px 45px rgba(0,0,0,.08);
        }

        .form {
            display: flex;
            gap: 10px;
        }

        #url {
            flex: 1;
            min-width: 0;
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 20px;
            font-size: 17px;
            outline: none;
            direction: ltr;
        }

        #url:focus {
            border-color: #172d50;
        }

        #download {
            border: none;
            border-radius: 15px;
            padding: 0 35px;
            background: #172d50;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        #download:hover {
            opacity: .9;
        }

        #download:disabled {
            opacity: .6;
            cursor: wait;
        }

        #status {
            display: none;
            margin-top: 18px;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
        }

        .success {
            display: block !important;
            background: #e9f8ee;
            color: #16823b;
        }

        .error {
            display: block !important;
            background: #fff0f0;
            color: #c62828;
        }

        .loading {
            display: block !important;
            background: #f0f3f8;
            color: #172d50;
        }

        .supported {
            margin-top: 45px;
            color: #777;
            font-size: 17px;
            line-height: 2;
        }

        footer {
            text-align: center;
            color: #888;
            padding: 40px 20px;
        }

        @media (max-width: 650px) {
            header {
                padding: 0 20px;
            }

            .hero {
                padding-top: 60px;
            }

            .form {
                flex-direction: column;
            }

            #download {
                height: 60px;
            }

            #url {
                width: 100%;
                height: 60px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">المركز الرقمي</div>
    <div>Digital Center</div>
</header>

<main class="hero">

    <h1>حمّل الفيديوهات والصور بسهولة</h1>

    <p>
        الصق رابط الفيديو أو الصورة للبدء
    </p>

    <div class="download-box">

        <div class="form">

            <input
                id="url"
                type="url"
                placeholder="الصق الرابط هنا..."
                autocomplete="off"
            >

            <button id="download" onclick="startDownload()">
                تنزيل
            </button>

        </div>

        <div id="status"></div>

    </div>

    <div class="supported">
        يدعم حاليًا:<br>
        YouTube · TikTok · Instagram · Facebook · X · Reddit · Pinterest
    </div>

</main>

<footer>
    © 2026 المركز الرقمي
</footer>


<script>

const RENDER_SERVER =
    "https://downloader-site-y3k0.onrender.com";


async function startDownload() {

    const input =
        document.getElementById("url");

    const button =
        document.getElementById("download");

    const status =
        document.getElementById("status");

    const url =
        input.value.trim();


    if (!url) {

        showStatus(
            "الرجاء لصق رابط أولاً",
            "error"
        );

        return;
    }


    button.disabled = true;
    button.textContent = "جاري التحميل...";

    showStatus(
        "جاري إرسال الرابط إلى خادم التحميل...",
        "loading"
    );


    try {

        const response = await fetch(
            RENDER_SERVER + "/download",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    url: url
                })
            }
        );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );
        }


        const contentType =
            response.headers.get("content-type") || "";


        /*
         * إذا كان السيرفر يرجع JSON
         */
        if (contentType.includes("application/json")) {

            const data =
                await response.json();


            if (data.download_url) {

                window.location.href =
                    data.download_url;

                showStatus(
                    "تم تجهيز الملف للتحميل",
                    "success"
                );

            }

            else if (data.url) {

                window.location.href =
                    data.url;

                showStatus(
                    "تم تجهيز الملف للتحميل",
                    "success"
                );

            }

            else {

                throw new Error(
                    data.error ||
                    "لم يتم العثور على رابط التحميل"
                );
            }

        }

        /*
         * إذا كان السيرفر يرجع الملف مباشرة
         */
        else {

            const blob =
                await response.blob();


            const fileURL =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href = fileURL;

            link.download = "download";


            document.body.appendChild(link);

            link.click();

            link.remove();


            URL.revokeObjectURL(fileURL);


            showStatus(
                "تم التحميل بنجاح",
                "success"
            );
        }


    } catch (error) {

        console.error(error);


        showStatus(
            "فشل التحميل. تأكد من الرابط وحاول مرة أخرى.",
            "error"
        );

    }


    button.disabled = false;

    button.textContent = "تنزيل";
}



function showStatus(message, type) {

    const status =
        document.getElementById("status");


    status.textContent =
        message;


    status.className =
        type;
}

</script>

</body>
</html>
